<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="剣と魔法と星の記憶。毎回変わる3つの迷宮を探索する、スマホ対応のターン制ダンジョンRPG。自動セーブ付き。"><title>エクステンドワールド - 星詠みの迷宮 -</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101827'/%3E%3Cpath d='M32 6L38 26L58 32L38 38L32 58L26 38L6 32L26 26Z' fill='%23efd28a'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
 <header class="mast"><a id="brand" href="#" aria-label="拠点へ">✧ <span>EXTEND WORLD<small>星詠みの迷宮</small></span></a><nav><button id="soundBtn" class="icon-btn" aria-label="音を切り替える" title="音を切り替える">音 OFF</button><button id="helpBtn" class="icon-btn">遊び方</button><button id="settingsBtn" class="icon-btn">記録</button></nav></header>
 <main id="home" class="screen"></main>
 <main id="play" class="screen hidden">
  <div class="journey-bar"><div><span id="dungeonLabel" class="eyebrow"></span><h1 id="floorLabel"></h1></div><div class="journey-actions"><button id="mapBtn" class="quiet">星図</button><button id="campBtn" class="quiet">中断</button></div></div>
  <div class="play-grid">
   <section class="board-column"><div id="compactStats"></div><div class="board-wrap"><canvas id="board" tabindex="0" aria-label="迷宮。方向キーで移動、Spaceで攻撃。敵も一歩ごとに行動します。"></canvas><div id="boardHint"></div><div id="floorToast"></div></div>
    <div id="eventLog" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="controls"><div class="dpad" aria-label="移動"><button data-dir="7" aria-label="左上に移動">↖</button><button data-dir="0" aria-label="上に移動">↑</button><button data-dir="1" aria-label="右上に移動">↗</button><button data-dir="6" aria-label="左に移動">←</button><button id="waitBtn" aria-label="1ターン待つ">待つ</button><button data-dir="2" aria-label="右に移動">→</button><button data-dir="5" aria-label="左下に移動">↙</button><button data-dir="4" aria-label="下に移動">↓</button><button data-dir="3" aria-label="右下に移動">↘</button></div><div class="action-grid"><button id="attackBtn" class="action attack">剣撃<small>Space</small></button><button id="magicBtn" class="action magic">星術<small>F</small></button><button id="interactBtn" class="action interact">触れる<small>E</small></button><button id="bagBtn" class="action">持ち物<small>I</small></button><button id="healBtn" class="quick">✚ 回復</button><button id="foodBtn" class="quick">◒ 食事</button></div></div>
   </section>
   <aside id="sidebar"></aside>
  </div>
 </main>
</div>
<div id="modalRoot"></div><div id="toast" role="status"></div><input type="file" id="importInput" accept="application/json,.json" class="hidden"><script type="module" src="app.js"></script>
</body></html>
